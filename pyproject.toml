[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "barrylab"
version = "0.1.0"
description = "Spatial-coding analysis for tetrode (DACQ) and Neuropixels recordings"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Barry Lab", email = "caswell.barry@ucl.ac.uk" }]
keywords = ["neuroscience", "electrophysiology", "place cells", "grid cells", "axona", "neuropixels"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
# Neuropixels front end (added in a later phase): loading + sorting live here so
# a DACQ-only user gets a featherweight install.
neuropixels = ["spikeinterface>=0.100", "probeinterface>=0.2"]
# NWB export/interchange (boundary only, not the working object).
nwb = ["pynwb>=2.5", "neuroconv>=0.4"]
plot = ["matplotlib>=3.5"]
# Watershed field segmentation for the field-shuffle grid-cell significance
# test (analysis/field_shuffle.py) -- scipy has no watershed implementation.
fieldshuffle = ["scikit-image>=0.17"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/Barry-lab/PythonSpkAnalysis"
Source = "https://github.com/Barry-lab/PythonSpkAnalysis"

[tool.hatch.build.targets.wheel]
packages = ["src/barrylab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# UP006/UP007/UP035 would rewrite typing.List/Tuple/Optional annotations to the
# PEP 585/604 builtin-generic forms (list[...], X | None). Those only *execute*
# on Python 3.9+, but this package is deliberately kept runnable on Python 3.6
# too (the lab's dev machine), where `Header = list[tuple[str, str]]` raises at
# import. Ignored so ruff doesn't reintroduce that breakage. See CONTRIBUTING.md.
ignore = ["UP006", "UP007", "UP035"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
