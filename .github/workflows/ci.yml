name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create venv and install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
      # Lint and type-check are ADVISORY (continue-on-error): they still run and
      # annotate the run, but do not fail the build. The tests are the gate.
      # Rationale: the lab's dev machine is stuck on Python 3.6, where ruff/mypy
      # can't be installed, so formatting/lint can't be enforced per-commit at
      # authoring time. Run `ruff format . && ruff check .` locally when you can
      # (on a Python 3.9+ machine) to keep things tidy; it just isn't blocking.
      - name: Lint (advisory)
        continue-on-error: true
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check (advisory)
        continue-on-error: true
        run: uv run mypy src/barrylab
      - name: Test
        run: uv run pytest --cov=barrylab --cov-report=term-missing
